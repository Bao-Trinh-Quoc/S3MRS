<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dark blue cube part -->
  <polygon points="50,75 100,50 100,100 50,125" fill="#003979"/>
  <!-- Light blue cube part -->
  <polygon points="100,50 150,75 150,125 100,100" fill="#0099cc"/>
  <!-- Middle cube part -->
  <polygon points="50,125 100,100 100,150 50,175" fill="#0077b6"/>
  <!-- Hexagon in the center -->
  <polygon points="85,100 115,100 125,120 115,140 85,140 75,120" fill="white"/>
  <!-- BK Text -->
  <text x="100" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#003979">BK</text>
  <!-- TP.HCM Text -->
  <text x="100" y="145" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#003979">TP.HCM</text>
</svg> 